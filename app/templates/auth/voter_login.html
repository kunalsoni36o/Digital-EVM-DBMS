{% extends "base.html" %}
{% block title %}Voter Login{% endblock %}
{% block content %}
<div class="container page-narrow">
  <h1 class="page-title">Voter Login</h1>
  <div class="card">
    <form method="post" action="{{ url_for('auth.voter_login') }}">
      {{ csrf_field() }}
      <div class="form-group">
        <label for="epic_no">EPIC Number</label>
        <input type="text" id="epic_no" name="epic_no" class="form-control monospace"
               placeholder="ABC1234567" maxlength="10" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Log In</button>
      <p class="form-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
